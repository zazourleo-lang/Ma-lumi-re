<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma Lumière</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5a800">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#fffaf0;--card:#fff;--tx:#1b2240;--mu:#6a6f85;--ac:#f5a800;--ok:#2e9e5b;--bd:#eadfc4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10142a;--card:#1a2040;--tx:#f3f1e8;--mu:#a3a8c3;--ac:#ffc933;--bd:#2c3460}}
:root[data-theme="dark"]{--bg:#10142a;--card:#1a2040;--tx:#f3f1e8;--mu:#a3a8c3;--ac:#ffc933;--bd:#2c3460}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 18px 6px;display:flex;align-items:center;gap:10px}
header .lg{width:34px;height:34px;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:19px}
header h1{font-size:20px;margin:0}header small{color:var(--mu);display:block;font-size:12px}
main{padding:8px 16px 110px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:13px}.big{font-size:24px;font-weight:700}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#1b2240;font-weight:700}
button.s{background:transparent;border:1px solid var(--bd);color:var(--tx);font-weight:600}
button.d{background:#d33;color:#fff}button.w{width:100%}
input,select,textarea{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok)}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--ac);color:#1b2240;font-weight:700}
.sc{overflow-x:auto;margin:8px -6px 0;padding-bottom:4px}
table{border-collapse:separate;border-spacing:0;font-size:12px;width:100%}
th,td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--bd);min-width:44px;white-space:nowrap}
th{color:var(--mu);font-weight:600;line-height:1.2}
.stk{position:sticky;left:0;background:var(--card);text-align:left;min-width:92px;max-width:110px;overflow:hidden;text-overflow:ellipsis;z-index:1;font-weight:600;border-right:1px solid var(--bd)}
td.c{cursor:pointer}.ok{color:var(--ok);font-weight:700;font-size:17px}.no{color:#d33;font-weight:700;font-size:17px}.fu{color:var(--mu)}
tr.now td{font-weight:700;background:#f5a80022}tr.past td{opacity:.55}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav button{flex:1;background:transparent;color:var(--mu);font-size:12px;padding:8px 4px;font-weight:600}
nav button b{display:block;font-size:22px}nav button.on{color:var(--tx)}nav button.on span{border-bottom:3px solid var(--ac)}
.soon{text-align:center;padding:40px 10px}.soon .e{font-size:48px}
.warn{background:#d3331a22;border:1px solid #d33;border-radius:12px;padding:12px;margin:10px 0}
.wa{display:inline-block;padding:8px 12px;border-radius:12px;background:#25d366;color:#fff;font-weight:700;text-decoration:none;font-size:14px}
.late{background:#d3331a18;border-radius:12px;padding:10px;margin-top:10px;font-size:14px}
</style>
</head>
<body>
<header><div class="lg">✨</div><div><h1>Ma Lumière</h1><small>Épargne et entraide</small></div></header>
<main id="app"></main>
<nav>
<button data-tab="sol" class="on"><b>🤝</b><span>Sòl</span></button>
<button data-tab="pay"><b>💳</b><span>Payer</span></button>
<button data-tab="env"><b>🌍</b><span>Envoyer</span></button>
</nav>
<script>
let tab='sol',view='list',cur=null,cf=null,groups=[];
try{groups=JSON.parse(localStorage.getItem('ml_groups')||'[]')}catch(e){groups=[]}
function save(){try{localStorage.setItem('ml_groups',JSON.stringify(groups))}catch(e){}}
groups.forEach(g=>{g.members=g.members.map(m=>{const r=splitPhone(m);if(!r)return m;(g.phones=g.phones||{})[r[0]]=r[1];if(g.pay)for(const k in g.pay){const q=k.split('|');if(q.slice(2).join('|')===m){delete g.pay[k];g.pay[q[0]+'|'+q[1]+'|'+r[0]]=1;}}return r[0];});});save();
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('fr-FR')+' HTG';
const today=()=>new Date().toISOString().slice(0,10);
const CL={jour:'chaque jour',semaine:'chaque semaine',cycle:'une fois par cycle'};
const WD=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
function dt(g,i){const d=new Date((g.start||today())+'T12:00:00');d.setDate(d.getDate()+i*(g.freq==='semaine'?7:g.freq==='quinzaine'?15:30));return d;}
const fd=d=>d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
function cols(g,i){
  const s=dt(g,i),days=Math.round((dt(g,i+1)-s)/864e5),out=[];
  if(g.cot==='jour')for(let d=0;d<days;d++){const x=new Date(s);x.setDate(x.getDate()+d);out.push({d:x,l:WD[x.getDay()]+'<br>'+x.getDate()});}
  else if(g.cot==='semaine')for(let w=0;w<Math.max(1,Math.floor(days/7));w++){const x=new Date(s);x.setDate(x.getDate()+7*w);out.push({d:x,l:'Sem '+(w+1)+'<br>'+x.getDate()+'/'+(x.getMonth()+1)});}
  else out.push({d:s,l:'Cycle<br>'+s.getDate()+'/'+(s.getMonth()+1)});
  return out;
}
const P=g=>g.pay||(g.pay={});
const SIPO='50941444209';
function sipo(){return '<a class="wa" style="display:block;text-align:center;margin-top:14px;padding:14px" href="https://wa.me/'+SIPO+'?text='+encodeURIComponent('Bonjour, j’ai besoin d’aide avec Ma Lumière 🙏')+'" target="_blank" rel="noopener">💬 Sipò : écris-nous sur WhatsApp</a>';}
const dig=p=>{let d=String(p||'').replace(/\D/g,'');if(d.length===8)d='509'+d;return d;};
function waLink(g,m,n){const t='Bonjour '+m+', petit rappel pour le sòl « '+g.name+' » : il te manque '+n+' versement'+(n>1?'s':'')+' de '+fmt(g.amt)+'. Merci de passer payer 🙏 — Ma Lumière';return 'https://wa.me/'+dig((g.phones||{})[m])+'?text='+encodeURIComponent(t);}
function remind(g,o,pay,now){
  if(!o.cs.some(c=>c.d<=now))return '';
  const late=g.members.map(m=>({m,n:o.cs.filter((c,ci)=>c.d<=now&&!pay[key(o.i,ci,m)]).length})).filter(x=>x.n>0);
  let h='<div class="card"><b>📲 Rappeler ceux qui n’ont pas payé</b>';
  if(!late.length)return h+'<div class="mu" style="margin-top:8px">✅ Tout le monde est à jour.</div></div>';
  h+='<div class="mu">Appuie sur le bouton vert : WhatsApp s’ouvre avec le message déjà écrit.</div>';
  late.forEach(x=>{const has=(g.phones||{})[x.m];h+=`<div class="row" style="margin-top:10px"><span><b>${esc(x.m)}</b><br><span class="mu">${x.n} versement${x.n>1?'s':''} manquant${x.n>1?'s':''}</span></span><span>${has?'':`<button class="s" style="padding:8px 12px" data-act="ph" data-m="${esc(x.m)}">＋ numéro</button> `}<a class="wa" href="${waLink(g,x.m,x.n)}" target="_blank" rel="noopener">📲 Rappeler</a></span></div>`;});
  return h+'</div>';
}
function splitPhone(s){const m=String(s).match(/^(.*?)[\s,;:\-]*(\+?\d[\d\s.\-]{6,}\d)$/);return m&&m[1].trim()?[m[1].trim(),m[2].trim()]:null;}
const key=(i,c,m)=>i+'|'+c+'|'+m;
function info(g){
  const n=g.members.length,done=g.round>=n,i=Math.min(g.round,n-1),cs=cols(g,i),k=cs.length,pay=P(g);
  let pd=0;g.members.forEach(m=>cs.forEach((_,c)=>{if(pay[key(i,c,m)])pd++;}));
  return{n,done,i,cs,k,per:g.amt*k,pot:g.amt*k*n,tot:n*k,pd,r:g.members[i],end:fd(dt(g,i+1))};
}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  if(tab==='pay')return app.innerHTML='<div class="soon"><div class="e">💳</div><h2>Payer</h2><p class="mu">Bientôt : crée une demande de paiement avec un lien ou un QR code, et garde tes reçus.</p></div>';
  if(tab==='env')return app.innerHTML='<div class="soon"><div class="e">🌍</div><h2>Envoyer</h2><p class="mu">Bientôt : compare les frais pour envoyer de l’argent en Haïti depuis l’étranger.</p></div>';
  if(view==='new')return renderNew();
  if(view==='det')return renderDet();
  renderList();
}
function renderList(){
  let h='<div class="row"><h2 style="margin:8px 0">Mes sòl</h2><button data-act="new">+ Nouveau</button></div>';
  if(!groups.length)h+='<div class="card soon" style="padding:30px"><div class="e">🤝</div><p><b>Aucun sòl pour l’instant</b></p><p class="mu">Un sòl, c’est un groupe où chacun met de l’argent, et un membre reçoit le total à chaque tour.</p><button class="w" data-act="new">Créer mon premier sòl</button></div>';
  groups.forEach(g=>{const o=info(g);
    h+=`<div class="card" data-act="open" data-id="${g.id}"><div class="row"><b>${esc(g.name)}</b><span class="chip">${o.done?'Terminé':'Tour '+(g.round+1)+'/'+o.n}</span></div>
    <div class="mu">${fmt(g.amt)} ${CL[g.cot]||''} • ${o.n} membres</div>`+
    (o.done?'<div class="mu" style="margin-top:6px">Tous les membres ont reçu 🎉</div>':`<div class="mu" style="margin-top:6px"><b style="color:var(--tx)">${esc(o.r)}</b> reçoit ${fmt(o.pot)} le ${o.end}</div><div class="bar"><i style="width:${o.pd/o.tot*100}%"></i></div>`)+`</div>`;});
  h+=sipo();
  app.innerHTML=h;
}
function renderNew(){
  app.innerHTML=`<h2 style="margin:8px 0">Nouveau sòl</h2>
  <label>Nom du sòl</label><input id="n" placeholder="Ex : Sòl de la famille">
  <label>Montant que chacun donne à chaque versement (HTG)</label><input id="a" type="number" inputmode="numeric" placeholder="Ex : 500">
  <label>Chacun donne…</label><select id="c"><option value="jour">chaque jour</option><option value="semaine">chaque semaine</option><option value="cycle">une seule fois par cycle</option></select>
  <label>Un membre reçoit tous les…</label><select id="f"><option value="semaine">semaine</option><option value="quinzaine">quinzaine</option><option value="mois">mois (30 jours)</option></select>
  <label>Date de début (le premier jour de versement)</label><input id="d" type="date" value="${today()}">
  <label>Membres, dans l’ordre de réception (un par ligne : Nom, numéro WhatsApp — le numéro est facultatif)</label><textarea id="m" rows="6" placeholder="Jacques, 3700 1122&#10;Lucie, 3811 2233&#10;Pierre"></textarea>
  <div id="err" class="mu" style="color:#d33;margin-bottom:8px"></div>
  <button class="w" data-act="create">Créer le sòl</button><button class="s w" style="margin-top:8px" data-act="back">Annuler</button>`;
}
function renderDet(){
  const g=groups.find(x=>x.id===cur);if(!g){view='list';return render();}
  const o=info(g),pay=P(g),now=new Date();now.setHours(23,59,59,0);
  let h=`<button class="s" data-act="back">← Retour</button><div class="card"><div class="row"><b style="font-size:18px">${esc(g.name)}</b><span class="chip">${o.done?'Terminé':'Tour '+(g.round+1)+'/'+o.n}</span></div>
  <div class="mu">Chacun donne ${fmt(g.amt)} ${CL[g.cot]}</div>`;
  if(o.done)h+='<div class="big" style="margin-top:12px">Sòl terminé 🎉</div></div>';
  else{
    h+=`<div class="mu" style="margin-top:12px">${esc(o.r)} reçoit 🎁</div><div class="big">${fmt(o.pot)}</div><div class="mu">le ${o.end}</div>
    <div class="mu" style="margin-top:6px">Chacun verse ${fmt(o.per)} en tout sur ce tour</div>
    <div class="bar"><i style="width:${o.pd/o.tot*100}%"></i></div><div class="mu" style="margin-top:4px">${o.pd}/${o.tot} versements faits</div>`;
    h+='</div><div class="card"><b>Tableau des versements</b><div class="mu">Appuie sur une case pour marquer ✓ payé</div><div class="sc"><table><thead><tr><th class="stk">Membre</th>'+o.cs.map(c=>'<th>'+c.l+'</th>').join('')+'<th>Total</th></tr></thead><tbody>';
    g.members.forEach((m,mi)=>{let cnt=0;
      h+=`<tr><td class="stk">${esc(m)}${m===o.r?' 🎁':''}</td>`;
      o.cs.forEach((c,ci)=>{const ok=pay[key(o.i,ci,m)];if(ok)cnt++;
        h+=`<td class="c" data-act="tg" data-m="${mi}" data-c="${ci}">${ok?'<span class="ok">✓</span>':c.d<=now?'<span class="no">✗</span>':'<span class="fu">·</span>'}</td>`;});
      h+=`<td><b>${cnt}/${o.k}</b></td></tr>`;});
    h+='<tr>'+'<td class="stk fu">Payés</td>'+o.cs.map((c,ci)=>'<td class="fu">'+g.members.filter(m=>pay[key(o.i,ci,m)]).length+'/'+o.n+'</td>').join('')+'<td></td></tr></tbody></table></div></div>';
    h+=remind(g,o,pay,now);
  }
  h+='<div class="card"><b>Qui touche et quand ?</b><div class="sc"><table><thead><tr><th class="stk">Membre</th><th>Jour de réception</th><th>Montant</th></tr></thead><tbody>';
  g.members.forEach((m,i)=>{const cl=i===g.round&&!o.done?'now':i<g.round?'past':'',a=g.amt*cols(g,i).length*o.n;
    h+=`<tr class="${cl}"><td class="stk">${i+1}. ${esc(m)}${cl==='now'?' 🎁':cl==='past'?' ✓':''}</td><td>${fd(dt(g,i+1))}</td><td>${fmt(a)}</td></tr>`;});
  h+='</tbody></table></div></div>';
  if(!o.done){
    if(cf==='next')h+=`<div class="warn">Tout le monde n’a pas fini de verser. Passer quand même au tour suivant ?<div class="row" style="margin-top:10px"><button data-act="next2">Oui, passer</button><button class="s" data-act="no">Non</button></div></div>`;
    else h+=`<button class="w" data-act="next">${o.pd>=o.tot?'Tour terminé → suivant':'Passer au tour suivant'}</button>`;}
  if(cf==='del')h+=`<div class="warn">Supprimer ce sòl pour toujours ?<div class="row" style="margin-top:10px"><button class="d" data-act="del2">Oui, supprimer</button><button class="s" data-act="no">Non</button></div></div>`;
  else h+='<button class="s w" style="margin-top:8px" data-act="del">Supprimer ce sòl</button>';
  h+=sipo();h+='<p class="mu" style="text-align:center">Ma Lumière note les versements. L’argent reste entre vous, par MonCash, NatCash ou en main propre.</p>';
  app.innerHTML=h;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;view='list';cf=null;return render();}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,g=groups.find(x=>x.id===cur);
  const sx=app.querySelector('.sc'),sl=sx?sx.scrollLeft:0;
  if(a==='new'){view='new';}
  else if(a==='back'){view='list';cf=null;}
  else if(a==='open'){cur=b.dataset.id;view='det';cf=null;}
  else if(a==='create'){
    const name=$('#n').value.trim(),amt=+$('#a').value,rows=$('#m').value.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{const i=s.indexOf(',');return i>=0?[s.slice(0,i).trim(),s.slice(i+1).trim()]:(splitPhone(s)||[s,'']);}).filter(r=>r[0]),mem=rows.map(r=>r[0]),phones={};rows.forEach(r=>{if(r[1])phones[r[0]]=r[1];});
    if(!name||!(amt>0)||mem.length<2){$('#err').textContent='Mets un nom, un montant, et au moins 2 membres.';return;}
    groups.unshift({id:String(Date.now()),name,amt,cot:$('#c').value,freq:$('#f').value,start:$('#d').value||today(),members:mem,phones,round:0,pay:{}});save();view='list';
  }
  else if(a==='tg'){const o=info(g),k=key(o.i,+b.dataset.c,g.members[+b.dataset.m]),p=P(g);if(p[k])delete p[k];else p[k]=1;save();}
  else if(a==='next'){if(info(g).pd>=info(g).tot){g.round++;save();}else cf='next';}
  else if(a==='next2'){g.round++;save();cf=null;}
  else if(a==='del'){cf='del';}
  else if(a==='del2'){groups=groups.filter(x=>x.id!==cur);save();view='list';cf=null;}
  else if(a==='ph'){const n=b.dataset.m,v=prompt('Numéro WhatsApp de '+n+' :');if(v&&v.trim()){(g.phones=g.phones||{})[n]=v.trim();save();}}
  else if(a==='no'){cf=null;}
  render();
  if(a==='tg'){const n=app.querySelector('.sc');if(n)n.scrollLeft=sl;}
});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
